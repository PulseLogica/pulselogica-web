# Minimal Supabase CLI config for LOCAL development and tests only.
# Not linked to any remote project. Only Postgres and the REST API are needed.
project_id = "pulselogica-web"

[api]
enabled = true
port = 55321
schemas = ["public"]

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
